<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HD Photo Enhancer</title>
<link rel="stylesheet" href="./hs.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>

</style>
</head>

<body>
  <div class="wrap">
    <h1>HD Photo Enhancer</h1>
 
    <div class="grid">
      <section class="stagebox" id="stagebox" aria-label="Preview">
        <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a photo">
          <b>Drop a photo here</b><span>or click to choose a JPG, PNG or WebP file</span>
        </div>
      </section>
      <aside class="panel" aria-label="Enhancement settings">
        <div class="ctl"><label>Size</label>
          <div class="seg" id="seg">
            <button type="button" data-s="2" aria-pressed="true">2x</button>
            <button type="button" data-s="3" aria-pressed="false">3x</button>
            <button type="button" data-s="4" aria-pressed="false">4x</button>
          </div>
        </div>
        <div class="ctl"><label for="sharp">Sharpness <output id="o_sharp">0.8</output></label><input id="sharp"
            type="range" min="0" max="2" step="0.1" value="0.8"></div>
        <div class="ctl"><label for="contrast">Contrast <output id="o_contrast">1.05</output></label><input
            id="contrast" type="range" min="0.7" max="1.4" step="0.01" value="1.05"></div>
        <div class="ctl"><label for="sat">Color <output id="o_sat">1.05</output></label><input id="sat" type="range"
            min="0.5" max="1.6" step="0.01" value="1.05"></div>
        <button class="btn" id="dl" disabled>Download PNG</button>
        <button class="btn ghost" id="new" disabled>Choose another photo</button>
        
      </aside>
    </div>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
<script src="./hd.js">
</script>
</body>
</html>
